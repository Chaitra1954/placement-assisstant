<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Placement Agenda Sync</title>

  <!-- Firebase Compatibility SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body style="font-family: sans-serif; padding: 20px; max-width: 600px; margin: auto;">

  <h2>🏢 Placement Agenda Manager</h2>

  <div style="margin-bottom: 15px;">
    <label><strong>Gemini API Key:</strong></label><br>
    <input type="password" id="apiKeyInput" placeholder="Paste Gemini API Key" style="width: 70%; padding: 8px;">
    <button id="toggleApiKeyBtn" onclick="toggleApiKey()">👁️ Show</button>
  </div>

  <div style="margin-bottom: 15px;">
    <label><strong>Paste Placement Notice:</strong></label><br>
    <textarea id="noticeInput" rows="6" style="width: 100%; padding: 8px;" placeholder="Paste email or text notice here..."></textarea>
  </div>

  <button onclick="extractSchedule()" style="background: #0d6efd; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; width: 100%;">
    ✨ Extract Schedule
  </button>

  <hr style="margin: 20px 0;">

  <div id="scheduleList">
    <p>Loading scheduled items...</p>
  </div>

  <script src="app.js"></script>
</body>
</html>
